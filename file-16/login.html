<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="https://kit.fontawesome.com/9f2bc5185e.js" crossorigin="anonymous"></script>
</head>
   
<body class="p-[10px] bg-[linear-gradient(180deg,rgba(0,0,0,1)_0%,rgba(17,47,94,1)_58%,rgba(2,75,153,1)_100%)]">
    <div class="flex h-screen gap-[100px]">
        <div class="w-2/3 relative">
          <img src="https://img.freepik.com/premium-photo/abstract-dark-blue-desert-background_520665-13658.jpg" class="w-full h-screen" alt="">
          <div class="flex flex-col items-center ">
          <p class="absolute bottom-[100px] text-white text-[35px]">AI Generative</p>
        <p class="absolute bottom-[60px] text-white text-[35px]">Anything You Want</p>
        <p class="absolute bottom-[30px] text-gray-500 text-[15px]">Generate any type of art </p>
        </div></div>
    <div class="flex flex-col  w-1/3 justify-center items-start gap-[20px]">
        <div class="flex flex-col gap-[1px]">
             <p class="text-gray-300 text-[10px]">Login</p>
        <p class="text-white text-[30px] font-[600]">Welcome Back!</p>
        <p class="text-gray-300 text-[12px]">Enter Your Email and Password</p>
        </div>
       <div class="flex flex-col gap-[4px]">
          <p class="text-gray-300 text-[12px]">Email Adress</p>
        <input type="email" placeholder="hello@gmail.com"  class="h-[30px] w-[300px] rounded-[10px] border border-gray-600 p-[15px] placeholder-gray-400 text-[12px] inputmail">
        <p class="text-[12px] text-red-800 font-[500] wrong" style="display:none">Email is wrong</p>
        <p class="text-[12px] text-red-800 font-[500] regex" style="display:none">Enter email in right way</p>
       </div>
      <div class="flex flex-col gap-[4px]">
          <p class="text-gray-300 text-[12px]">Password</p>
          <div class="flex relative">
               <input  type="password" placeholder="Input your password" class="h-[30px] rounded-[10px] w-[300px] border border-gray-600 p-[15px] placeholder-gray-400 text-[12px] inputpass in">
        <i class="fa-solid fa-eye text-gray-300 absolute right-[10px] text-[12px] top-[10px]"></i>
        <i class="fa-solid fa-eye-slash text-gray-300 absolute right-[10px] text-[12px] top-[10px]" style="display:none"></i>
        
          </div>
     <p class="text-[12px] text-red-800 font-[500] wrong" style="display:none">Password is wrong</p>
      </div>
      
        <a href="./forgot.html" class="text-white text-[13px] underline underline-offset-2">Forgot Password?</a>
      <button class="text-white bg-[linear-gradient(180deg,rgba(0,0,0,1)_0%,rgba(28,27,27,1)_51%,rgba(33,29,29,1)_100%)] text-sm w-[300px] h-[40px] rounded-[10px] hover:opacity-90 transition button">Sign up</button>
    </div>
    </div>
    <script src="./login.js"></script>
</body>


</html>
